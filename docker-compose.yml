services:
  compileo-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - compileo_storage:/app/storage
      - compileo_plugins:/app/plugins
      - compileo_hf_models:/app/src/compileo/features/ingestion/hf_models
    environment:
      - COMPILEO_JWT_SECRET_KEY=${COMPILEO_JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - DATABASE_URL=sqlite:///./storage/database.db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app:/home/compileo/.local/lib/python3.12/site-packages
      - COMPILEO_REDIS_HOST=redis
      - COMPILEO_REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - compileo-network
    restart: unless-stopped

  compileo-gui:
    build:
      context: .
      dockerfile: Dockerfile.gui.light
    ports:
      - "8501:8501"
    volumes:
      - compileo_storage:/app/storage
      - compileo_plugins:/app/plugins
    environment:
      - API_BASE_URL=${API_BASE_URL}
      - COMPILEO_JWT_SECRET_KEY=${COMPILEO_JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - PYTHONPATH=/app:/home/compileo/.local/lib/python3.12/site-packages
      - REDIS_URL=${REDIS_URL}
      - COMPILEO_REDIS_HOST=redis
      - COMPILEO_REDIS_PORT=6379
    depends_on:
      - compileo-api
    networks:
      - compileo-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - compileo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

volumes:
  compileo_storage:
  compileo_plugins:
  compileo_hf_models:
  redis_data:

networks:
  compileo-network:
    driver: bridge